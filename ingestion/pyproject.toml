[project]
name = "ai-stock-ingestion"
version = "0.1.0"
description = "Version-controlled data pipeline (SEC EDGAR + yfinance) for ai-stock-analysis"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "yfinance>=0.2.50",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.6",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "respx==0.22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
