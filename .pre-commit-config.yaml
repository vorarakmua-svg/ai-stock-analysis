# Pre-commit hooks for the ai-stock-analysis repo.
# Install once with:  pip install pre-commit && pre-commit install
# Run on demand with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Guard against accidentally committing the bulky data blobs
        # (520KB per-stock JSONs, 6.9MB financial_history.csv).
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies:
          - pydantic==2.10.4
