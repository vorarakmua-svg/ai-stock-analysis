# Pre-commit hooks for the ai-stock-analysis repo.
# Install once with:  pip install pre-commit && pre-commit install
# Run on demand with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Guard against accidentally committing the bulky data blobs
        # (520KB per-stock JSONs, 6.9MB financial_history.csv).
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # mypy runs as a blocking gate, mirroring CI (`cd backend && mypy app`). A
  # local/system hook is used so the project's own environment supplies all
  # runtime deps (redis, sqlalchemy, arq, ...) and the pyproject config, rather
  # than maintaining a separate isolated dependency list. Requires the backend
  # dev extras installed: `pip install -e "backend[dev]"`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend/app)
        entry: bash -c 'cd backend && mypy app'
        language: system
        types: [python]
        files: ^backend/app/
        pass_filenames: false
