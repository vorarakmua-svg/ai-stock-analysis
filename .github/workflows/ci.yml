name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Test code is held to a clean bar from day one.
      - name: Ruff lint (tests)
        run: ruff check tests
      - name: Ruff format check (tests)
        run: ruff format --check tests

      # App code has a pre-existing lint/type backlog; these are informational
      # until the dedicated cleanup pass lands, then flip continue-on-error off.
      - name: Ruff lint (app, informational)
        run: ruff check app
        continue-on-error: true
      - name: mypy (app, informational)
        run: mypy app
        continue-on-error: true

      - name: Pytest + coverage
        env:
          # Lets the AIExtractor key check pass; all Gemini calls are mocked.
          GOOGLE_API_KEY: test-dummy
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=55

  ingestion:
    name: Ingestion (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check ingestion tests
      - name: Ruff format check
        run: ruff format --check ingestion tests
      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Informational until a frontend lint/test cleanup + vitest setup lands.
      - name: Lint
        run: npm run lint
        continue-on-error: true
